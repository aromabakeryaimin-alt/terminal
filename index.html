<!DOCTYPE html>
<html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSIS 內部終端機 - 身份驗證與管理</title>
<style>
:root{--p:#003366;--a:#0066cc;--bg:#e9ecef;--card:#fff;--sec:#f4f6f8;--bd:#c8d1d9;--tx:#222;--mut:#555;--ok:#007a33;--warn:#d9822b;--bad:#b30000}
@media(prefers-color-scheme:dark){:root{--p:#6fb3ec;--a:#2a7fd4;--bg:#0f1720;--card:#16212c;--sec:#1b2733;--bd:#2c3b4a;--tx:#e8eef4;--mut:#9fb0c0}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans HK","PingFang HK","Microsoft JhengHei","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;min-height:100vh}
header{background:#003366;color:#fff;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
h1{font-size:1.1rem}.container{max-width:1000px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:4px;padding:20px}.ct{color:var(--p);font-weight:700;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--sec)}
.info{display:grid;grid-template-columns:110px 1fr;gap:8px}.info .l{color:var(--mut);font-weight:600;text-align:right;padding-right:8px}.info .v{border-bottom:1px solid var(--sec);padding-bottom:3px;word-break:break-all}
.banner{padding:22px;font-size:1.25rem;font-weight:700;border-radius:4px;text-align:center;background:var(--sec);border:1px solid var(--bd);margin-bottom:12px}
button{padding:9px 16px;border:0;border-radius:3px;font-weight:600;cursor:pointer;background:var(--a);color:#fff;font-size:.95rem}
button:disabled{opacity:.5;cursor:not-allowed}.warn{background:var(--warn)}.bad{background:var(--bad)}.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:3px;font-size:.95rem;background:var(--card);color:var(--tx)}input:disabled,select:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--a);outline-offset:1px}
.ov{position:fixed;inset:0;background:rgba(0,40,70,.6);display:none;justify-content:center;align-items:center;z-index:50;padding:16px}
.adm{background:var(--card);width:100%;max-width:960px;height:88vh;border-radius:4px;display:flex;flex-direction:column;overflow:hidden}
.ah{padding:12px 18px;display:flex;justify-content:space-between;align-items:center;background:var(--sec);border-bottom:1px solid var(--bd);color:var(--p);font-weight:700}
.tabs{display:flex;flex-wrap:wrap;background:var(--sec);border-bottom:1px solid var(--bd)}.tb{flex:1;min-width:110px;background:none;color:var(--mut);border-radius:0;border-right:1px solid var(--bd)}.tb.on{background:var(--card);color:var(--p);border-bottom:2px solid var(--a)}
.tc{display:none;padding:18px;flex:1;overflow-y:auto}.tc.on{display:block}
.hint{background:var(--sec);border-left:4px solid var(--warn);padding:10px 12px;margin-bottom:12px;font-weight:600}
table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--bd)}th{background:var(--sec);color:var(--mut)}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--sec)}tr.sel{background:rgba(0,102,204,.15)}.c{text-align:center;color:var(--mut)}
.tag{padding:2px 8px;border-radius:2px;font-size:.8rem;font-weight:700}.pend{background:#fff3cd;color:#856404}.done{background:#dff0d8;color:#3c763d}
.fg{display:grid;grid-template-columns:90px 1fr;gap:12px 10px;align-items:center;max-width:560px;margin:14px auto}.fg label{text-align:right;font-weight:600;color:var(--mut)}
.mb{background:var(--card);border-radius:4px;max-width:450px;width:100%;padding:22px}#cm-t{white-space:pre-wrap;margin-bottom:16px;font-weight:500}#cm-in{margin-bottom:14px}.row{display:flex;gap:10px}.row>*{flex:1}
[hidden]{display:none!important}
</style></head><body>
<header><h1>CSIS 內部終端機 - 身份驗證與管理</h1><button class="warn" onclick="openAdmin()">進入管理系統</button></header>
<div class="container"><div class="grid">
 <div class="card"><div class="ct">憑證讀取資料</div><div class="info" id="info"></div></div>
 <div class="card" style="display:flex;flex-direction:column;justify-content:center"><div class="banner" id="banner">請感應憑證或掃描市民二維碼</div><div id="detail" style="text-align:center;color:var(--mut)">等待系統感應...</div></div>
</div></div>

<div class="ov" id="admin"><div class="adm">
 <div class="ah"><span>CSIS 管理員控制中心</span><button class="bad" onclick="closeAdmin()">退出管理系統</button></div>
 <div class="tabs"><button class="tb on" data-t="t-req">網上申請審核</button><button class="tb" data-t="t-rep">現場更換憑證</button><button class="tb" data-t="t-new">現場簽發新證</button><button class="tb" data-t="t-bc">系統廣播</button><button class="tb" data-t="t-list">人員紀錄與注銷</button><button class="tb" data-t="t-aud">審計日誌</button></div>
 <div id="t-req" class="tc on"><div id="pend-hint" class="hint">請點選待處理申請，再感應空白憑證簽發。（完成項目 1 分鐘後隱藏）</div><table id="rq"><thead><tr><th>類型</th><th>姓名</th><th>電話</th><th>備註</th><th>狀態</th></tr></thead><tbody></tbody></table></div>
 <div id="t-rep" class="tc"><div id="rep-h" class="hint"></div><div id="rep-i" class="c" style="margin:26px 0;font-size:1.1rem"></div><div class="c"><button onclick="resetRep()">中止並重新操作</button></div></div>
 <div id="t-new" class="tc"><div id="new-h" class="hint"></div><div id="new-l" class="c" style="font-weight:700;margin-bottom:12px"></div>
  <div class="fg"><label>登記姓名</label><input id="c-name" disabled><label>出生日期</label><input id="c-dob" type="date" disabled><label>電話號碼</label><input id="c-ph" type="tel" disabled><label>居住地區</label><input id="c-rg" disabled><label>性別</label><select id="c-g" disabled><option>男</option><option>女</option></select></div>
  <div class="c"><button id="save" disabled onclick="run(saveNew,this)">儲存資料並簽發新證</button></div></div>
 <div id="t-bc" class="tc"><div class="hint">廣播將即時彈出至所有市民頁面。</div><div style="max-width:560px;margin:auto">
  <textarea id="bc-t" rows="4" maxlength="300" placeholder="輸入廣播內容"></textarea>
  <div class="row" style="margin:10px 0"><select id="bc-d"><option value="5">5 分鐘後失效</option><option value="30">30 分鐘後失效</option><option value="60">1 小時後失效</option><option value="0">不自動失效</option></select></div>
  <div class="row"><button onclick="run(sendBc,this)">發送廣播</button><button class="sec" onclick="run(clearBc,this)">清除廣播</button></div></div></div>
 <div id="t-list" class="tc"><input id="q" placeholder="搜尋姓名 / 卡號 / 智能編號 / 地區" style="margin-bottom:10px"><div id="cx-h" class="hint" style="border-color:var(--bad)" hidden></div>
  <table id="pt"><thead><tr><th>憑證號碼</th><th>智能編號</th><th>姓名</th><th>電話</th><th>地區</th></tr></thead><tbody></tbody></table>
  <div class="c" style="margin-top:12px"><button class="bad" onclick="reqCancel()">注銷選取人員</button></div></div>
 <div id="t-aud" class="tc"><div id="aud-s" class="hint"></div><table id="at"><thead><tr><th>時間</th><th>操作者</th><th>動作</th><th>詳情</th></tr></thead><tbody></tbody></table></div>
</div></div>

<div id="cm" class="ov" style="z-index:99" role="dialog" aria-modal="true"><div class="mb"><div id="cm-t"></div><input id="cm-in" type="password" hidden><div class="row"><button id="cm-ok">確認</button><button id="cm-no" class="sec" hidden>取消</button></div></div></div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyD42CHramMOT5yu6d0WhkMFs_5ZwQiPvPI",authDomain:"ks11-a4274.firebaseapp.com",databaseURL:"https://ks11-a4274-default-rtdb.firebaseio.com",projectId:"ks11-a4274"});
const database=firebase.database(),$=id=>document.getElementById(id),enc=new TextEncoder();
const VALIDITY_MINUTES=10,GAP=500; // GAP：讀卡機每粒字最長間隔(毫秒)
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''),rnd=()=>hex(crypto.getRandomValues(new Uint8Array(16)));
const sha=async s=>hex(await crypto.subtle.digest('SHA-256',enc.encode(s)));
async function pbkdf2(p,salt){const k=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},k,256))}
async function hmac(sec,msg){const k=await crypto.subtle.importKey('raw',enc.encode(sec),{name:'HMAC',hash:'SHA-256'},false,['sign']);return hex(await crypto.subtle.sign('HMAC',k,enc.encode(msg)))}
async function audit(act,detail){const r=database.ref('/audit'),l=(await r.orderByKey().limitToLast(1).once('value')).val(),prev=l?Object.values(l)[0].hash:'GENESIS',ts=Date.now();await r.push({ts,actor:'admin',act,detail:String(detail),prev,hash:await sha(prev+ts+'admin'+act+detail)})}
const getId=async id=>(await database.ref('/identities/'+id).once('value')).val();
async function findBySmart(sc){const ix=(await database.ref('/smartIndex/'+sc).once('value')).val();if(ix){const r=await getId(ix);if(r)return r}
 const s=(await database.ref('/identities').orderByChild('smart_code').equalTo(sc).once('value')).val(),r=s?Object.values(s)[0]:null;if(r)database.ref('/smartIndex/'+sc).set(r.card_id);return r}
const getAll=async()=>Object.values((await database.ref('/identities').once('value')).val()||{});
const expOf=r=>r.expires_at||new Date(r.issue_time).getTime()+VALIDITY_MINUTES*60000;
async function newSmart(){for(;;){const c=String.fromCharCode(65+Math.floor(Math.random()*26))+Math.floor(1000+Math.random()*9000);if(!await findBySmart(c))return c}}
const fresh=()=>({issue_time:new Date().toISOString(),expires_at:Date.now()+VALIDITY_MINUTES*60000,qr_secret:rnd()});

let mcb=null;
function modal(msg,o={}){$('cm-t').textContent=msg;$('cm-in').hidden=!o.input;$('cm-in').value='';$('cm-no').hidden=!(o.confirm||o.input);mcb=o.cb||null;$('cm').style.display='flex';(o.input?$('cm-in'):$('cm-ok')).focus()}
function closeM(ok){const v=$('cm-in').value,c=mcb;mcb=null;$('cm').style.display='none';if(c)c(ok,v)}
$('cm-ok').onclick=()=>closeM(true);$('cm-no').onclick=()=>closeM(false);
$('cm-in').addEventListener('keydown',e=>{if(e.key==='Enter')closeM(true)});
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('cm').style.display==='flex')closeM(false)});
const say=m=>new Promise(r=>modal(m,{cb:r})),ask=m=>new Promise(r=>modal(m,{confirm:true,cb:r}));
async function run(fn,btn){if(btn)btn.disabled=true;try{await fn()}catch(e){console.error(e);say('系統連線錯誤：'+(e.code||e.message||''))}finally{if(btn)btn.disabled=false}}

let isOpen=false,cur='t-req',apps=[],appsRef=null,appsH=null,poll=null,st={},buf='',last=0;

/* ---------- 感應輸入 (讀卡機 / QR 掃描器均模擬鍵盤輸入) ---------- */
addEventListener('keydown',e=>{
 if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||$('cm').style.display==='flex')return;
 const n=Date.now();if(n-last>GAP)buf='';last=n;
 if(e.key==='Enter'){const v=buf.trim();buf='';if(v)run(()=>scan(v))}else if(e.key.length===1)buf+=e.key});
async function scan(v){
 if(v.startsWith('CSIS.'))return verifyQR(v);
 if(!/^\d{10}$/.test(v))return say('系統警告：感應資料格式無效。');
 if(isOpen)return adminSwipe(v);
 const r=await getId(v);r?show(r,'實體卡'):fail('驗證失敗：未註冊','此憑證未在資料庫中找到匹配紀錄。',v)}
async function verifyQR(v){
 const [,sc,w,sig]=v.split('.'),r=sc&&await findBySmart(sc);
 if(!r||!r.qr_secret)return fail('二維碼無效','找不到對應身份或未啟用二維碼。',sc||'--');
 if(Math.abs(Math.floor(Date.now()/30000)-Number(w))>1)return fail('二維碼已過期','請市民重新開啟頁面（截圖無效）。',r.card_id);
 if((await hmac(r.qr_secret,sc+w)).slice(0,16)!==sig)return fail('簽名驗證失敗','二維碼可能被偽造或篡改。',r.card_id);
 show(r,'動態二維碼')}
function paint(rows,msg,bg,desc){$('info').innerHTML=rows.map(([l,v])=>`<div class="l">${l}</div><div class="v">${esc(v)}</div>`).join('');const b=$('banner');b.style.background=bg;b.style.color=bg?'#fff':'';b.textContent=msg;$('detail').textContent=desc}
function fail(msg,desc,id){paint([['憑證號碼:',id],['系統狀態:','驗證失敗']],msg,'var(--bad)',desc);audit('VERIFY_FAIL',msg+' '+id)}
function show(r,via){const left=Math.floor((expOf(r)-Date.now())/1000),ok=left>0;
 paint([['實體憑證號碼:',r.card_id],['智能編號:',r.smart_code],['登記姓名:',r.name],['性別:',r.gender],['出生日期:',r.dob],['電話號碼:',r.phone||'未提供'],['登記地區:',r.region],['系統狀態:',ok?`有效 (剩餘 ${Math.floor(left/60)}分${left%60}秒)`:'已過期'],['驗證方式:',via]],
  ok?'驗證通過：身份有效':'警告：憑證已逾期',ok?'var(--ok)':'var(--warn)',ok?`系統紀錄匹配，持證人：${r.name}`:'請指導市民進行換證手續。')}

/* ---------- 管理員 (PIN) ---------- */
async function openAdmin(){
 const c=(await database.ref('/admin/cfg').once('value')).val();
 modal(c?'請輸入管理員 PIN：':'首次使用：請設定管理員 PIN（最少 6 位）：',{input:true,cb:async(ok,v)=>{if(!ok)return;try{
  if(!c){if(v.length<6)return say('PIN 最少 6 位。');const salt=rnd();await database.ref('/admin/cfg').set({salt,hash:await pbkdf2(v,salt)});await audit('SET_PIN','')}
  else if(await pbkdf2(v,c.salt)!==c.hash){await audit('ADMIN_LOGIN_FAIL','');return say('PIN 錯誤。')}
  await audit('ADMIN_LOGIN','');enter()}catch(e){say('連線錯誤：'+(e.code||e.message))}}})}
function enter(){$('admin').style.display='flex';isOpen=true;resetAll();
 appsRef=database.ref('/applications');appsH=appsRef.on('value',s=>{apps=Object.values(s.val()||{});if(cur==='t-req')drawReq()});poll=setInterval(()=>{if(cur==='t-req')drawReq()},10000)}
function closeAdmin(){$('admin').style.display='none';isOpen=false;clearInterval(poll);if(appsRef)appsRef.off('value',appsH);audit('ADMIN_LOGOUT','')}
document.querySelectorAll('.tb').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tb,.tc').forEach(e=>e.classList.remove('on'));b.classList.add('on');cur=b.dataset.t;$(cur).classList.add('on');document.activeElement.blur();resetAll();
 if(cur==='t-req')drawReq();if(cur==='t-list')run(loadList);if(cur==='t-aud')run(loadAudit)});
async function adminSwipe(id){({'t-req':issueApp,'t-rep':repSwipe,'t-new':newSwipe,'t-list':cxSwipe}[cur]||(()=>{}))(id)}

/* ---------- 網上申請 ---------- */
function drawReq(){const now=Date.now(),v=apps.filter(a=>a.status!=='APPROVED'||now-(a.approved_at||0)<6e4).sort((a,b)=>(a.ts||0)-(b.ts||0)),tb=$('rq').querySelector('tbody');
 tb.innerHTML=v.length?'':'<tr><td colspan="5" class="c">目前無待處理申請</td></tr>';
 v.forEach(a=>{const tr=document.createElement('tr'),p=a.status==='PENDING';if(st.app&&st.app.id===a.id)tr.className='sel';
  tr.innerHTML=`<td>換領憑證</td><td><b>${esc(a.name)}</b></td><td>${esc(a.phone||'--')}</td><td>換證: ${esc(a.reason||'--')}</td><td><span class="tag ${p?'pend':'done'}">${p?'等待簽發':'已完成'}</span></td>`;
  tr.onclick=()=>{if(!p)return say('此申請已完成處理。');st.app=a;$('pend-hint').textContent=`已選取 ${a.name}，請感應空白憑證完成簽發。`;drawReq()};tb.appendChild(tr)})}
async function issueApp(cardId){
 const app=st.app;if(!app)return say('請先自列表選取一項申請。');
 const old=await findBySmart(app.smart_code||app.oldCardId)||await getId(app.oldCardId);if(!old)return say('錯誤：找不到申請人的舊憑證紀錄。');
 if(await getId(cardId))return say('操作無效：此憑證已被註冊使用。');
 const u={};u['identities/'+old.card_id]=null;u['identities/'+cardId]={...old,...fresh(),card_id:cardId,phone:app.phone};u['smartIndex/'+old.smart_code]=cardId;
 u['applications/'+app.id+'/status']='APPROVED';u['applications/'+app.id+'/approved_at']=Date.now();
 await database.ref().update(u);await audit('ISSUE_REPLACE',`${old.smart_code} ${old.card_id}->${cardId}`);st.app=null;
 $('pend-hint').textContent='請點選待處理申請，再感應空白憑證簽發。';say(`手續完成！\n實體憑證號碼: ${cardId}\n智能編號: ${old.smart_code}`)}

/* ---------- 現場更換 ---------- */
function resetRep(){st.old=null;$('rep-h').textContent='步驟 1：請感應【原有舊憑證】';$('rep-i').textContent='系統等待讀取舊憑證...'}
async function repSwipe(id){
 if(!st.old){const r=await getId(id);if(!r)return say('資料庫中未尋獲此憑證紀錄。');st.old=r;$('rep-h').textContent='步驟 2：請感應【全新空白憑證】';$('rep-i').textContent='舊戶口已鎖定：'+r.name;return}
 if(id===st.old.card_id)return say('新舊憑證不可為同一張。');if(await getId(id))return say('新卡已被註冊使用。');
 const o=st.old,u={};u['identities/'+o.card_id]=null;u['identities/'+id]={...o,...fresh(),card_id:id};u['smartIndex/'+o.smart_code]=id;
 await database.ref().update(u);await audit('REPLACE_ONSITE',`${o.smart_code} ${o.card_id}->${id}`);resetRep();say('換領手續完成！\n新憑證號碼: '+id)}

/* ---------- 現場簽發 ---------- */
const NF=['c-name','c-dob','c-ph','c-rg','c-g'];
function resetNew(){st.nc=null;$('new-h').textContent='必須先感應【全新空白憑證】，方可解鎖資料輸入。';$('new-h').style.borderColor='var(--bad)';$('new-l').textContent='目前狀態：未讀取卡片';NF.forEach(i=>{$(i).value=i==='c-g'?'男':'';$(i).disabled=true});$('save').disabled=true}
async function newSwipe(id){if(st.nc)return;if(await getId(id))return say('此憑證號碼已註冊。');st.nc=id;$('new-h').textContent='空白憑證已鎖定，請輸入資料';$('new-h').style.borderColor='var(--ok)';$('new-l').textContent='已綁定憑證號碼: '+id;NF.forEach(i=>$(i).disabled=false);$('save').disabled=false;$('c-name').focus()}
async function saveNew(){
 const name=$('c-name').value.trim(),dob=$('c-dob').value,phone=$('c-ph').value.trim(),region=$('c-rg').value.trim(),gender=$('c-g').value;
 if(!name||!dob||!phone||!region)return say('請完整填寫所有欄位。');if(!/^[0-9+\- ]{6,15}$/.test(phone))return say('電話格式不正確。');
 const sc=await newSmart(),id=st.nc,u={};u['identities/'+id]={card_id:id,smart_code:sc,name,dob,phone,region,gender,...fresh()};u['smartIndex/'+sc]=id;
 await database.ref().update(u);await audit('ISSUE_NEW',`${sc} ${id}`);resetNew();say(`簽發完成！\n實體憑證號碼: ${id}\n智能編號: ${sc}`)}

/* ---------- 廣播 ---------- */
async function sendBc(){const t=$('bc-t').value.trim();if(!t)return say('請輸入廣播內容！');const m=Number($('bc-d').value);
 await database.ref('/broadcast').set({text:t,updated_at:Date.now(),expires_at:m?Date.now()+m*6e4:null});await audit('BROADCAST',t.slice(0,60));say('✅ 廣播已發送。')}
async function clearBc(){await database.ref('/broadcast').remove();$('bc-t').value='';await audit('BROADCAST_CLEAR','');say('✅ 廣播已清除。')}

/* ---------- 人員紀錄與注銷 ---------- */
let people=[];
async function loadList(){people=await getAll();drawList()}
function drawList(){const q=$('q').value.trim().toLowerCase(),tb=$('pt').querySelector('tbody'),l=people.filter(r=>!q||[r.card_id,r.smart_code,r.name,r.region].join(' ').toLowerCase().includes(q));
 tb.innerHTML=l.length?'':'<tr><td colspan="5" class="c">無紀錄</td></tr>';
 l.forEach(r=>{const tr=document.createElement('tr');if(st.row&&st.row.card_id===r.card_id)tr.className='sel';tr.innerHTML=`<td>${esc(r.card_id)}</td><td>${esc(r.smart_code)}</td><td><b>${esc(r.name)}</b></td><td>${esc(r.phone||'--')}</td><td>${esc(r.region)}</td>`;tr.onclick=()=>{st.row=r;drawList()};tb.appendChild(tr)})}
$('q').oninput=drawList;
function resetCx(){st.cx=null;st.row=null;$('cx-h').hidden=true}
function reqCancel(){if(!st.row)return say('請先自列表選取欲注銷之人員。');st.cx=st.row.card_id;$('cx-h').hidden=false;$('cx-h').textContent=`即將注銷 ${st.row.name}。請感應憑證 [${st.cx}] 以確認！`}
async function cxSwipe(id){if(!st.cx||id!==st.cx){resetCx();drawList();return say('操作失敗：未選取人員或感應之憑證不符。')}
 const r=st.row,u={};u['identities/'+id]=null;u['smartIndex/'+r.smart_code]=null;await database.ref().update(u);await audit('CANCEL',`${r.smart_code} ${id}`);resetCx();await loadList();say('該紀錄已自系統中注銷。')}

/* ---------- 審計日誌 (雜湊鏈驗證) ---------- */
async function loadAudit(){
 const l=Object.values((await database.ref('/audit').orderByKey().limitToLast(50).once('value')).val()||{});let ok=true;
 for(let i=0;i<l.length;i++){const e=l[i];if(await sha(e.prev+e.ts+e.actor+e.act+e.detail)!==e.hash||(i>0&&e.prev!==l[i-1].hash))ok=false}
 const s=$('aud-s');s.textContent=ok?`✅ 日誌雜湊鏈完整（最近 ${l.length} 筆）`:'❌ 偵測到日誌被篡改或缺漏！';s.style.borderColor=ok?'var(--ok)':'var(--bad)';
 $('at').querySelector('tbody').innerHTML=l.reverse().map(e=>`<tr><td>${esc(new Date(e.ts).toLocaleString('zh-HK'))}</td><td>${esc(e.actor)}</td><td>${esc(e.act)}</td><td>${esc(e.detail)}</td></tr>`).join('')||'<tr><td colspan="4" class="c">暫無日誌</td></tr>'}

function resetAll(){resetRep();resetNew();resetCx()}
</script></body></html>
